---
# ===================================================================
# Global Variables — áp dụng cho tất cả hosts
# ===================================================================

# === Timezone ===
timezone: "Asia/Ho_Chi_Minh"

# === APT ===
apt_cache_valid_time: 3600

# === Package versions (pin) ===
containerd_version: "2.0.*"
kubelet_version: "1.32.*"
kubeadm_version: "1.32.*"
kubectl_version: "1.32.*"

# === Registry mirrors ===
# Thêm internal mirror nếu có:
registry_mirrors:
  registry.k8s.io: "https://registry.k8s.io"
  docker.io: "https://docker.io"
  quay.io: "https://quay.io"

# === Kernel tuning ===
kernel_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.core.somaxconn: 32768
  net.ipv4.tcp_max_syn_backlog: 32768
  net.core.netdev_max_backlog: 16384
  net.ipv4.tcp_rmem: "4096 87380 16777216"
  net.ipv4.tcp_wmem: "4096 65536 16777216"
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_tw_reuse: 1
  vm.swappiness: 0
  vm.overcommit_memory: 1
  vm.max_map_count: 262144
  fs.file-max: 2097152
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288
  kernel.panic: 10
  kernel.panic_on_oops: 1

# === Kernel modules ===
kernel_modules:
  - overlay
  - br_netfilter
  - nf_conntrack
  - nf_nat

# === etcd backup ===
etcd_backup_enabled: true
etcd_backup_interval_minutes: 30
etcd_backup_retention_hours: 24
etcd_backup_dir: "/var/backups/k8s/etcd"

# === Audit logging ===
audit_log_enabled: true
audit_log_dir: "/var/log/kubernetes/audit"
audit_log_maxage: 30
audit_log_maxbackup: 10
audit_log_maxsize: 100

# === Certificates ===
cert_expiry: "87600h"  # 10 years
