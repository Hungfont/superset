---
# ===================================================================
# Ansible Inventory — Kubernetes Cluster
#
# SỬA các IP, hostname, và CIDR cho đúng môi trường của bạn
# ===================================================================

all:
  vars:
    # === Cluster Network ===
    pod_network_cidr: "10.244.0.0/16"
    service_network_cidr: "10.96.0.0/12"
    cluster_domain: "cluster.local"
    kubernetes_version: "1.32"

    # === Node Network ===
    # Dải IP dùng cho MetalLB (phải cùng subnet với LAN, không conflict DHCP)
    lb_ip_range: "192.168.1.200-192.168.1.210"

    # === Network interface chính ===
    # Kiểm tra bằng: ip -4 addr show | grep -oP '(?<=^\d: ).*(?=:.*state UP)' | head -1
    network_interface: "eth0"

    # === Container runtime ===
    container_runtime: containerd

    # === Calico ===
    calico_version: "v3.29"
    calico_network_mode: "vxlan"  # "vxlan" or "ipip"

    # === Ingress ===
    ingress_controller_enabled: true
    ingress_mode: "loadbalancer"  # "loadbalancer", "host-network", "nodeport"
    ingress_replicas: 2

    # === MetalLB ===
    metallb_enabled: true
    metallb_mode: "l2"  # "l2" or "bgp"

    # === Ansible ===
    ansible_user: root
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            k8s-master:
              ansible_host: 192.168.1.100
              node_ip: 192.168.1.100
              node_name: k8s-master

        workers:
          hosts:
            k8s-worker-1:
              ansible_host: 192.168.1.101
              node_ip: 192.168.1.101
              node_name: k8s-worker-1
            k8s-worker-2:
              ansible_host: 192.168.1.102
              node_ip: 192.168.1.102
              node_name: k8s-worker-2
