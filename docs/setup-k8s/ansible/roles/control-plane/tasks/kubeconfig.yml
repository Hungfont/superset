---
# ===================================================================
# Setup kubeconfig for root and ansible user
# ===================================================================

- name: "Create .kube directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - /root/.kube
    - "{{ ansible_env.HOME }}/.kube"

- name: "Copy admin.conf to root kubeconfig"
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'

- name: "Copy admin.conf to user kubeconfig"
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: true
    mode: '0600'
    owner: "{{ ansible_user_id }}"

- name: "Set KUBECONFIG env var"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: '^export KUBECONFIG='
    line: 'export KUBECONFIG="{{ ansible_env.HOME }}/.kube/config"'
    create: true
