---
# ===================================================================
# Bootstrap Handlers
# ===================================================================

- name: reboot_required
  ansible.builtin.reboot:
    reboot_timeout: 300
    pre_reboot_delay: 10
    post_reboot_delay: 30
  listen: reboot_required

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
    daemon_reload: true

- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true

- name: restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
