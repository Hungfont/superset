---
# ===================================================================
# containerd installation & configuration
# ===================================================================

- name: "Add Docker GPG key"
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present

- name: "Add Docker APT repository"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') | replace('aarch64','arm64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: true

- name: "Install containerd"
  ansible.builtin.apt:
    name: containerd.io
    state: present
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: "Hold containerd version (prevent accidental upgrade)"
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: "Create containerd config directory"
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: "Generate default containerd config"
  ansible.builtin.shell: |
    containerd config default > /etc/containerd/config.toml.generated
  args:
    creates: /etc/containerd/config.toml.generated

- name: "Set containerd config from generated template"
  ansible.builtin.copy:
    src: /etc/containerd/config.toml.generated
    dest: /etc/containerd/config.toml
    remote_src: true
    mode: '0644'
  notify: restart containerd

- name: "Enable SystemdCgroup in containerd"
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: "Set sandbox image (pause) for K8s 1.32"
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'sandbox_image =.*'
    replace: 'sandbox_image = "registry.k8s.io/pause:3.10"'
  notify: restart containerd

- name: "Configure containerd performance tuning"
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: 'max_concurrent_downloads ='
      line: 'max_concurrent_downloads = 10'
    - regexp: 'max_concurrent_uploads ='
      line: 'max_concurrent_uploads = 10'
    - regexp: 'discard_unpacked_layers ='
      line: 'discard_unpacked_layers = true'
  notify: restart containerd

- name: "Create registry mirrors config"
  ansible.builtin.file:
    path: /etc/containerd/certs.d
    state: directory
    mode: '0755'

- name: "Generate containerd registry mirrors config"
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/registry-mirrors.toml
    content: |
      # Registry mirrors — Ansible managed
      {% for server, mirror in registry_mirrors.items() %}
      [plugins."io.containerd.grpc.v1.cri".registry.mirrors."{{ server }}"]
        endpoint = ["{{ mirror }}", "https://{{ server }}"]
      {% endfor %}
    mode: '0644'
  notify: restart containerd

- name: "Ensure containerd is running and enabled"
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
