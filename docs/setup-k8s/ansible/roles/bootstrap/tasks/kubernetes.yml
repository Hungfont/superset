---
# ===================================================================
# Kubernetes package installation
# ===================================================================

- name: "Add Kubernetes GPG key"
  ansible.builtin.apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present

- name: "Add Kubernetes APT repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    update_cache: true

- name: "Pin Kubernetes packages (priority 1001)"
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/kubernetes
    content: |
      Package: kubelet kubeadm kubectl
      Pin: origin pkgs.k8s.io
      Pin-Priority: 1001
    mode: '0644'

- name: "Install Kubernetes packages"
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    cache_valid_time: "{{ apt_cache_valid_time }}"
  register: k8s_install

- name: "Hold Kubernetes packages (prevent upgrade)"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: "Display installed versions"
  ansible.builtin.debug:
    msg:
      - "kubelet: {{ k8s_install.results[0].version | default('unknown') }}"
      - "kubeadm: {{ k8s_install.results[1].version | default('unknown') }}"
      - "kubectl: {{ k8s_install.results[2].version | default('unknown') }}"
  when: k8s_install is changed
