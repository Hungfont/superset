# ─── Superset Project · MemPalace Codebase Map ─────────────────────────────
# Root mempalace.yml — indexes all wings across the monorepo.
# Sub-wings inherit from: backend/mempalace.yaml, frontend/mempalace.yaml, docs/mempalace.yaml
# Non-code wings (sessions, rules, planning) are defined only here.
# ────────────────────────────────────────────────────────────────────────────

project: superset
description: |
  Full-stack Superset-like BI platform.
  Monorepo with Go backend (Chi router, Postgres, Redis), React frontend (Vite, shadcn/ui, Zustand, TanStack Query),
  and comprehensive docs (CODEMAPS, DB schemas, sequence diagrams, service requirements by phase).

# ════════════════════════════════════════════════════════════════════════════
# Wings
# ════════════════════════════════════════════════════════════════════════════
wings:

  # ── Backend (inherits backend/mempalace.yaml) ────────────────────────────
  - name: backend
    source: backend/mempalace.yaml
    tech: [go, chi, postgres, redis, jwt, websocket]
    entrypoints:
      - backend/cmd/api/main.go
    configs:
      - backend/configs/config.go
      - backend/go.mod
    rooms:
      - name: app
        description: Core application logic — auth, dataset, db, query services
        keywords: [app, service, executor, worker, handler, usecase]
      - name: delivery
        description: HTTP handlers, routers, middleware, WebSocket endpoints
        keywords: [handler, router, http, websocket, middleware, delivery]
      - name: domain
        description: Domain models, entities, repository interfaces, error definitions
        keywords: [entity, domain, model, repository, errors]
      - name: repository
        description: Data access implementations — Postgres, Redis, other stores
        keywords: [repo, repository, postgres, redis, database, query]
      - name: pkg
        description: Shared utilities — crypto, JWT, email, password helpers
        keywords: [pkg, util, helper, crypto, jwt, email]
      - name: cmd
        description: Application entry points and CLI commands
        keywords: [cmd, main, cli, entrypoint]
      - name: migrations
        description: Database migration files
        keywords: [migration, migrate, sql]
      - name: config
        description: Application configuration and environment settings
        keywords: [config, configuration, yaml, toml, env]
      - name: test
        description: Test utilities, fixtures, integration test setup
        keywords: [test, fixture, integration, benchmark]

  # ── Frontend (inherits frontend/mempalace.yaml) ──────────────────────────
  - name: frontend
    source: frontend/mempalace.yaml
    tech: [react, typescript, vite, shadcn-ui, zustand, tanstack-query, tailwind]
    entrypoints:
      - frontend/src/main.tsx
      - frontend/src/App.tsx
    configs:
      - frontend/package.json
      - frontend/tsconfig.json
      - frontend/vite.config.ts
      - frontend/components.json
      - frontend/tailwind.config.js
    rooms:
      - name: pages
        description: Page-level components — admin, auth, datasets, explore, sqllab
        keywords: [page, route, screen, view, admin, sqllab, explore]
      - name: components
        description: Reusable UI components and feature-specific components
        keywords: [component, ui, badge, table, dialog, button]
      - name: api
        description: API client functions and endpoint definitions
        keywords: [api, endpoint, fetch, request, client, axios]
      - name: stores
        description: State management — auth, SQL lab, WebSocket stores
        keywords: [store, state, zustand, auth, ws, sqlLab]
      - name: hooks
        description: Custom React hooks for data fetching and lifecycle
        keywords: [hook, use, effect, query, mutation]
      - name: lib
        description: Library configurations — shadcn/ui, client setup
        keywords: [lib, config, shadcn, client, utils]
      - name: test
        description: Test setup, mocks, and test utilities
        keywords: [test, setup, mock, vi, vitest]

  # ── Docs (inherits docs/mempalace.yaml) ──────────────────────────────────
  - name: docs
    source: docs/mempalace.yaml
    description: Project documentation, architecture, requirements, and diagrams
    rooms:
      - name: codemaps
        description: Codebase maps, navigation guides, and INDEX
        keywords: [codemap, codebase, navigation, structure]
      - name: db_schema
        description: Database schemas, table definitions, and overviews
        keywords: [database, db, schema, table, migration]
      - name: architecture
        description: Architecture diagrams, HLD, and sequence diagrams
        keywords: [architecture, diagram, hld, sequence, design]
      - name: requirements
        description: Feature requirements, specifications, and service docs
        keywords: [requirement, spec, feature, service, phase]

  # ── Rules & Config (defined here only) ───────────────────────────────────
  - name: rules
    description: Claude Code workspace rules — style, testing, security, hooks, MemPalace integration
    path: .claude/rules/
    rooms:
      - name: common
        description: Cross-cutting rules — code-review, coding-style, hooks, mempalace, pattern, performance, security, testing
        keywords: [rule, standard, guideline, policy]

  # ── Sessions (mined conversation history, defined here only) ─────────────
  - name: sessions
    description: Mined agent conversation history — technical discussions, architecture decisions, planning, problems
    rooms:
      - name: technical
        description: Technical discussions and implementation details
        keywords: [tech, implementation, fix, feature, code]
      - name: architecture
        description: Architecture decisions, design discussions, trade-offs
        keywords: [architecture, design, decision, trade-off, pattern]
      - name: planning
        description: Planning sessions, task breakdowns, estimates
        keywords: [plan, planning, estimate, milestone, roadmap]
      - name: general
        description: General conversation and meta-discussion
        keywords: [general, meta, chat, discussion]
      - name: problems
        description: Bug reports, issues, debugging sessions
        keywords: [bug, issue, problem, debug, error, fix]

  # ── Root configs & meta ──────────────────────────────────────────────────
  - name: root
    description: Top-level project configuration, build scripts, and meta files
    files:
      - CLAUDE.MD
      - AGENTS.MD
      - .gitignore
      - skills-lock.json
      - mempalace.yml

# ════════════════════════════════════════════════════════════════════════════
# Cross-wing tunnels (semantic links between domains)
# ════════════════════════════════════════════════════════════════════════════
tunnels:
  - from: [backend, delivery]
    to: [frontend, api]
    label: REST API contract — backend handlers → frontend api client

  - from: [backend, domain]
    to: [docs, db_schema]
    label: Domain entities map to database tables

  - from: [docs, requirements]
    to: [backend, app]
    label: Feature specs drive backend services

  - from: [docs, requirements]
    to: [frontend, pages]
    label: Feature specs drive frontend pages

  - from: [docs, architecture]
    to: [backend, delivery]
    label: HLD and sequence diagrams document handler flows

  - from: [docs, codemaps]
    to: [backend, app]
    label: CODEMAP indexes backend module structure

  - from: [docs, codemaps]
    to: [frontend, pages]
    label: CODEMAP indexes frontend page structure
